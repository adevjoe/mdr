name: Release

# On v* tags: test -> build macOS / Linux binaries -> publish a GitHub Release -> (optionally) update the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Linux builds link musl statically, so they don't depend on the distro's glibc version
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version v$version in Cargo.toml" >&2
            exit 1
          fi

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          bin="target/${{ matrix.target }}/release/mdr"
          "$bin" --version
          "$bin" --no-color --width 60 examples/sample.md | grep -q "mdr sample document"
          if [ "$RUNNER_OS" = Linux ] && ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "the Linux binary should be statically linked" >&2; ldd "$bin"; exit 1
          fi

      - name: Package
        run: |
          name="mdr-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$name" mdr
          shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: mdr-${{ matrix.target }}
          path: mdr-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create checksums file
        run: cat *.sha256 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            mdr-*.tar.gz
            checksums.txt

  homebrew:
    # Requires the HOMEBREW_TAP_TOKEN secret (a token with write access to adevjoe/homebrew-tap); skipped otherwise.
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Skip without token
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set, skipping the Homebrew tap update"

      - uses: actions/checkout@v7
        if: env.HAS_TAP_TOKEN == 'true'

      - uses: actions/checkout@v7
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'adevjoe/homebrew-tap' }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" > tap/Formula/mdr.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mdr.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
          else
            git commit -m "mdr ${GITHUB_REF_NAME#v}"
            git push
          fi
