name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh install.sh
          shellcheck scripts/homebrew-formula.sh

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          ./target/release/mdr --no-color --width 60 examples/sample.md > out-file.txt
          ./target/release/mdr --no-color --width 60 < examples/sample.md > out-stdin.txt
          cmp out-file.txt out-stdin.txt
          grep -q "mdr sample document" out-file.txt
          grep -q "│ Element" out-file.txt
          ./target/release/mdr --no-color --width 60 examples/sample.zh-CN.md | grep -q "mdr 示例文档"
          if grep -q $'\x1b' out-file.txt; then echo "piped output must not contain escape sequences" >&2; exit 1; fi
